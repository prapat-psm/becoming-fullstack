name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roombook
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: roombook_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U roombook -d roombook_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://roombook:ci-postgres@127.0.0.1:5432/roombook_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
